      <main class="doc">
        <h1 data-fr="Conditions d’utilisation" data-en="Terms of Use"></h1>
        <p
          class="meta"
          data-fr="En vigueur au 16 novembre 2026"
          data-en="Effective 16 November 2026"
        ></p>

        <p
          class="lead"
          data-fr="Ces conditions encadrent l’utilisation de Todo Bene et de son abonnement Premium. En créant un compte, tu les acceptes. Elles sont écrites pour être lues : si quelque chose n’est pas clair, écris-nous."
          data-en="These terms cover using Todo Bene and its Premium subscription. By creating an account, you accept them. They are written to be read: if anything is unclear, write to us."
        ></p>

        <h2 data-fr="Qui fait Todo Bene" data-en="Who makes Todo Bene"></h2>
        <p
          data-fr="Todo Bene est conçu et exploité par un développeur indépendant. Ses coordonnées de professionnel, exigées par le droit européen, figurent sur la page de l’app dans l’App Store et sur Google Play. Pour tout le reste : <a href='mailto:todobene.app@gmail.com'>todobene.app@gmail.com</a>."
          data-en="Todo Bene is designed and run by an independent developer. The trader details EU law requires are shown on the app's page in the App Store and on Google Play. For anything else: <a href='mailto:todobene.app@gmail.com'>todobene.app@gmail.com</a>."
        ></p>

        <h2 data-fr="Le service" data-en="The service"></h2>
        <p
          data-fr="Todo Bene est une liste de tâches partagée entre deux personnes. Chacun a son propre compte, et deux comptes se rejoignent dans un espace avec un code d’invitation. Un espace compte deux membres au maximum. Tu es responsable de ton mot de passe et de ce qui est fait depuis ton compte. Il faut avoir l’âge d’accepter ces conditions là où tu vis, ou l’accord d’un parent."
          data-en="Todo Bene is a to-do list shared between two people. Each of you has your own account, and two accounts join one space with an invite code. A space has at most two members. You are responsible for your password and for what is done from your account. You need to be old enough to accept these terms where you live, or have a parent's permission."
        ></p>

        <h2 data-fr="Gratuit et Premium" data-en="Free and Premium"></h2>
        <ul>
          <li
            data-fr="<strong>Gratuit</strong> — ta liste, celle de ton ou ta partenaire et la liste Maison, avec jusqu’à 6 tâches en cours chacune."
            data-en="<strong>Free</strong> — your list, your partner's list and the Home list, with up to 6 open tasks each."
          ></li>
          <li
            data-fr="<strong>Premium</strong> — la liste Courses, et plus aucune limite de tâches."
            data-en="<strong>Premium</strong> — the Groceries list, and no limit on tasks."
          ></li>
        </ul>
        <p
          data-fr="Ce que contient chaque offre peut évoluer. Si Premium perd quelque chose d’important, on le dit dans l’app avant le renouvellement suivant."
          data-en="What each tier includes may change. If Premium loses something significant, we say so in the app before your next renewal."
        ></p>

        <h2 data-fr="L’abonnement" data-en="The subscription"></h2>
        <ul>
          <li
            data-fr="<strong>Prix.</strong> Le prix affiché dans l’app avant l’achat, dans ta devise (4 € par mois en France). Le paiement est encaissé par Apple ou Google, sur le compte avec lequel tu achètes."
            data-en="<strong>Price.</strong> The price shown in the app before you buy, in your currency (€4 a month in France). Payment is taken by Apple or Google, on the account you buy with."
          ></li>
          <li
            data-fr="<strong>Renouvellement automatique.</strong> L’abonnement se renouvelle chaque mois, au même prix, sauf si tu l’annules au moins 24 heures avant la fin de la période en cours."
            data-en="<strong>Automatic renewal.</strong> The subscription renews every month at the same price unless you cancel it at least 24 hours before the end of the current period."
          ></li>
          <li
            data-fr="<strong>Annuler.</strong> Dans les réglages d’abonnement de l’App Store ou de Google Play (Réglages → Premium → Gérer l’abonnement y mène). Premium reste actif jusqu’à la fin de la période déjà payée ; il n’y a pas de remboursement au prorata."
            data-en="<strong>Cancelling.</strong> In your App Store or Google Play subscription settings (Settings → Premium → Manage subscription takes you there). Premium stays on until the end of the period already paid; there is no pro-rata refund."
          ></li>
          <li
            data-fr="<strong>Remboursements.</strong> Ils sont traités par Apple ou Google, selon leurs propres règles — Todo Bene n’a pas accès à ton paiement. Si tu vis dans l’Union européenne, tu peux disposer d’un droit de rétractation de 14 jours, que tu exerces auprès d’eux."
            data-en="<strong>Refunds.</strong> These are handled by Apple or Google under their own rules — Todo Bene has no access to your payment. If you live in the European Union, you may have a 14-day right of withdrawal, which you exercise with them."
          ></li>
          <li
            data-fr="<strong>Changement de prix.</strong> Il est annoncé à l’avance par l’App Store ou Google Play, selon leurs règles, et tu peux annuler avant qu’il s’applique."
            data-en="<strong>Price changes.</strong> These are announced in advance by the App Store or Google Play, under their rules, and you can cancel before one applies."
          ></li>
        </ul>

        <h2 data-fr="Un abonnement pour vous deux" data-en="One subscription for you both"></h2>
        <p
          data-fr="Un seul abonnement suffit : tant que la personne qui paie est dans l’espace, vous avez Premium tous les deux. Si elle quitte l’espace, Premium part avec elle et l’autre repasse en gratuit. Supprimer ton compte n’annule pas l’abonnement : annule-le d’abord dans les réglages de l’App Store ou de Google Play, sinon le store continue de le facturer."
          data-en="One subscription is enough: while the person who pays is in the space, you both have Premium. If they leave the space, Premium goes with them and the other person is back on the free tier. Deleting your account doesn't cancel the subscription: cancel it first in your App Store or Google Play settings, or the store keeps billing it."
        ></p>

        <h2 data-fr="Quand Premium s’arrête" data-en="When Premium ends"></h2>
        <p
          data-fr="Rien n’est supprimé. Les listes qui dépassent 6 tâches en cours restent consultables : tu peux cocher et modifier, mais pas ajouter. La liste Courses est verrouillée et retrouve tout son contenu si Premium revient."
          data-en="Nothing is deleted. Lists over 6 open tasks stay as they are: you can tick and edit, but not add. The Groceries list is locked, and comes back with everything in it if Premium returns."
        ></p>

        <h2 data-fr="Ton contenu" data-en="Your content"></h2>
        <p
          data-fr="Tes tâches t’appartiennent. Tu nous autorises seulement à les stocker et à les afficher pour faire fonctionner l’app : à toi, et à ton ou ta partenaire pour celles qui ne sont pas privées. N’utilise pas Todo Bene pour quelque chose d’illégal ou pour nuire à quelqu’un. La façon dont tes données sont traitées est détaillée sur la <a href='./privacy.html'>page confidentialité</a>."
          data-en="Your tasks belong to you. You only allow us to store and display them so the app works: to you, and to your partner for the ones that aren't private. Don't use Todo Bene for anything illegal or to harm anyone. How your data is handled is set out on the <a href='./privacy.html'>privacy page</a>."
        ></p>

        <h2 data-fr="Disponibilité" data-en="Availability"></h2>
        <p
          data-fr="On fait en sorte que Todo Bene fonctionne bien et sans interruption, sans pouvoir le garantir à chaque instant. Les fonctionnalités peuvent évoluer. Si Todo Bene devait fermer, on le dirait dans l’app suffisamment à l’avance pour que tu puisses exporter tes données, et aucun renouvellement ne serait facturé après la fermeture."
          data-en="We work to keep Todo Bene running well and without interruption, but can't guarantee it at every moment. Features may change. If Todo Bene ever shuts down, we will say so in the app early enough for you to export your data, and no renewal will be charged after it closes."
        ></p>

        <h2 data-fr="Fin d’utilisation" data-en="Ending"></h2>
        <p
          data-fr="Tu peux quitter ton espace ou supprimer ton compte à tout moment, depuis Réglages (voir la <a href='./support.html#delete-account'>page d’aide</a>). Nous pouvons suspendre un compte qui enfreint ces conditions ou la loi, en te prévenant sauf si la loi l’interdit."
          data-en="You can leave your space or delete your account at any time, from Settings (see the <a href='./support.html#delete-account'>support page</a>). We may suspend an account that breaks these terms or the law, telling you unless the law forbids it."
        ></p>

        <h2 data-fr="Responsabilité" data-en="Liability"></h2>
        <p
          data-fr="Todo Bene est une liste de tâches : ne t’en sers pas comme unique rappel pour quelque chose de vital, comme un médicament. Dans la mesure permise par la loi, nous ne sommes pas responsables des pertes indirectes liées à l’utilisation de l’app. Rien dans ces conditions ne limite les droits que la loi de ton pays te garantit en tant que consommateur."
          data-en="Todo Bene is a to-do list: don't rely on it as the only reminder for something vital, such as medication. To the extent the law allows, we are not liable for indirect losses arising from using the app. Nothing in these terms limits the rights the law of your country gives you as a consumer."
        ></p>

        <h2 data-fr="Sur iPhone" data-en="On iPhone"></h2>
        <p
          data-fr="Si tu utilises Todo Bene sur iPhone, le <a href='https://www.apple.com/legal/internet-services/itunes/dev/stdeula/'>contrat de licence standard d’Apple</a> s’applique aussi. Apple n’est pas responsable de l’app ni de son assistance : c’est nous."
          data-en="If you use Todo Bene on iPhone, <a href='https://www.apple.com/legal/internet-services/itunes/dev/stdeula/'>Apple's standard licence agreement</a> applies too. Apple is not responsible for the app or its support: we are."
        ></p>

        <h2 data-fr="Droit applicable" data-en="Governing law"></h2>
        <p
          data-fr="Ces conditions sont régies par le droit français, sans te priver de la protection des règles impératives du pays où tu vis. En cas de désaccord, écris-nous d’abord : la plupart des problèmes se règlent en un échange."
          data-en="These terms are governed by French law, without taking away the protection of the mandatory rules of the country where you live. If something goes wrong, write to us first: most problems are settled in one exchange."
        ></p>

        <h2 data-fr="Modifications" data-en="Changes"></h2>
        <p
          data-fr="Ces conditions peuvent évoluer. Un changement important s’accompagne d’une nouvelle date en haut et d’un message dans l’app avant qu’il s’applique. Un changement de prix suit les règles de l’App Store ou de Google Play décrites plus haut."
          data-en="These terms may change. A material change comes with a new date at the top and an in-app message before it applies. A price change follows the App Store or Google Play rules described above."
        ></p>

        </p>
