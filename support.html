<!doctype html>
<html lang="fr" data-title-fr="Todo Bene — Aide" data-title-en="Todo Bene — Support">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Bene — Aide</title>
    <meta
      name="description"
      content="Comment se jumeler, partager une liste, quitter un espace ou supprimer son compte — et comment nous écrire."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./doc.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="logo" href="./index.html"><span class="ticks">✓✓</span>Todo Bene</a>
        <button class="lang" id="langBtn" aria-label="Switch language">EN</button>
      </header>

      <main class="doc">
        <h1 data-fr="Aide" data-en="Support"></h1>
        <p
          class="lead"
          data-fr="Todo Bene est fait par une seule personne. Écris à todobene.app@gmail.com et tu auras une vraie réponse sous 48 heures ouvrées — dis-nous ton modèle de téléphone et la version de l’app (en bas de l’écran Réglages), ça fait gagner un aller-retour."
          data-en="Todo Bene is made by one person. Write to todobene.app@gmail.com and you will get a real answer within 48 working hours — mention your phone model and the app version (at the bottom of the Settings screen), it saves a round trip."
        ></p>
        <p>
          <a href="mailto:todobene.app@gmail.com">todobene.app@gmail.com</a>
        </p>

        <h2 data-fr="Se jumeler" data-en="Pairing up"></h2>
        <h3 data-fr="Comment on commence ?" data-en="How do we start?"></h3>
        <p
          data-fr="L’un de vous crée l’espace et obtient un code de six lettres. Appuie sur « Envoyer l’invitation » : le message contient un lien et le code. Si l’autre personne appuie sur le lien depuis son téléphone, l’app s’ouvre avec le code déjà rempli — il ne reste qu’à confirmer. Sinon, elle choisit « Rejoindre » et tape les six caractères."
          data-en="One of you creates the space and gets a six-letter code. Tap “Share invite”: the message contains a link and the code. If the other person taps the link on their phone, the app opens with the code already filled in and they just confirm. Otherwise they choose “Join” and type the six characters."
        ></p>
        <h3 data-fr="Le code ne marche pas" data-en="The code does not work"></h3>
        <p
          data-fr="Trois causes, dans l’ordre : l’espace a déjà deux membres (c’est la limite, un espace est fait pour deux) ; le code a été mal recopié — il n’y a ni O ni zéro, ni I ni un, justement pour éviter ça ; ou la personne est déjà dans un autre espace, et doit d’abord le quitter dans Réglages."
          data-en="Three causes, in order: the space already has two members (that is the limit — a space is built for two); the code was mistyped — there is no O or zero, no I or one, precisely to avoid that; or the person is already in another space and has to leave it first, under Settings."
        ></p>

        <h2 data-fr="Au quotidien" data-en="Day to day"></h2>
        <h3 data-fr="Ajouter une tâche" data-en="Adding a task"></h3>
        <p
          data-fr="Écris dans la barre du bas et valide. Une date en langage naturel est comprise au passage : « payer le loyer vendredi » pose l’échéance à vendredi, et un rappel arrive le matin même. L’heure du rappel se règle tâche par tâche."
          data-en="Type in the bar at the bottom and confirm. A date in plain language is picked up as you go: “pay rent friday” sets the due date to Friday, and a reminder lands that morning. The reminder time is set per task."
        ></p>
        <h3 data-fr="Les quatre listes" data-en="The four lists"></h3>
        <p
          data-fr="Maison et Courses sont partagées ; chacun a en plus sa liste perso. C’est tout, volontairement."
          data-en="Home and Groceries are shared; each of you also has a personal list. That is all, on purpose."
        ></p>
        <h3 data-fr="Cacher une tâche" data-en="Hiding a task"></h3>
        <p
          data-fr="Ouvre les options de la tâche et choisis « Rendre privé ». Elle disparaît de l’écran de l’autre, même sur une liste partagée, et ne déclenche jamais de notification. C’est ce qui permet de préparer un cadeau sans quitter l’app."
          data-en="Open the task's options and choose “Make private”. It disappears from the other person's screen, even on a shared list, and never triggers a notification. That is what lets you plan a gift without leaving the app."
        ></p>
        <h3 data-fr="Trop de notifications" data-en="Too many notifications"></h3>
        <p
          data-fr="Réglages → Notifications. Trois interrupteurs : les ajouts dans une liste partagée, les tâches terminées, et les heures calmes (22h–7h). Ce sont tes réglages à toi qui décident de ce que ton téléphone reçoit, pas ceux de l’autre."
          data-en="Settings → Notifications. Three switches: adds to a shared list, completed tasks, and quiet hours (22:00–07:00). Your own settings decide what your phone receives, not the other person's."
        ></p>

        <h2 data-fr="Compte et données" data-en="Account and data"></h2>
        <h3 data-fr="Changer mon prénom" data-en="Changing my name"></h3>
        <p
          data-fr="Réglages → Toi. Il apparaît sur ta liste perso et à côté des tâches que tu as ajoutées."
          data-en="Settings → You. It shows on your personal list and next to the tasks you added."
        ></p>
        <h3 data-fr="Mot de passe oublié" data-en="Forgotten password"></h3>
        <p
          data-fr="Sur l’écran de connexion, « Mot de passe oublié ? ». Un lien arrive par email et te dépose directement sur l’écran de nouveau mot de passe. Le lien expire — s’il ne marche plus, redemande-en un."
          data-en="On the sign-in screen, “Forgot your password?”. A link arrives by email and drops you straight on the new-password screen. The link expires — if it no longer works, ask for another."
        ></p>
        <h3 data-fr="Exporter mes données" data-en="Exporting my data"></h3>
        <p
          data-fr="Réglages → Exporter mes données. Un fichier JSON avec ton compte, votre espace et tes tâches, que tu peux enregistrer ou t’envoyer par email."
          data-en="Settings → Export my data. A JSON file with your account, your space and your tasks, to save or email to yourself."
        ></p>
        <h3 data-fr="Quitter l’espace" data-en="Leaving the space"></h3>
        <p
          data-fr="Réglages → Quitter cet espace. Si ton ou ta partenaire reste, les tâches partagées restent chez elle ou lui et tu repars sans rien ; il te faudra un nouveau code pour revenir. Si tu es la dernière personne, l’espace et toutes ses tâches sont supprimés. L’app te dit lequel des deux cas s’applique avant de confirmer."
          data-en="Settings → Leave this space. If your partner stays, the shared tasks stay with them and you leave with nothing; you will need a new code to come back. If you are the last one, the space and every task in it are deleted. The app tells you which of the two applies before you confirm."
        ></p>
        <h3 id="delete-account" data-fr="Supprimer mon compte" data-en="Deleting my account"></h3>
        <p
          data-fr="Réglages → Supprimer mon compte. C’est définitif et immédiat. Même règle que ci-dessus : les tâches partagées que tu as ajoutées restent chez ton ou ta partenaire pour que ses listes continuent de fonctionner ; ta liste perso et tes tâches privées disparaissent. Si personne ne reste, tout est supprimé."
          data-en="Settings → Delete my account. Permanent and immediate. Same rule as above: shared tasks you added stay with your partner so their lists keep working; your personal list and your private tasks are gone. If nobody is left, everything is deleted."
        ></p>
        <p
          data-fr="Tu n’as plus l’app ? Écris à <a href='mailto:todobene.app@gmail.com'>todobene.app@gmail.com</a> depuis l’adresse de ton compte, et on le supprime sous 7 jours, avec la même règle. Supprimer le compte n’annule pas un abonnement Premium : il s’arrête dans les réglages d’abonnement d’Apple ou de Google."
          data-en="No longer have the app? Email <a href='mailto:todobene.app@gmail.com'>todobene.app@gmail.com</a> from your account's address and we delete it within 7 days, by the same rule. Deleting the account doesn't cancel a Premium subscription: that stops in Apple's or Google's subscription settings."
        ></p>
        <h3 data-fr="Et la confidentialité ?" data-en="What about privacy?"></h3>
        <p
          data-fr="Tout est détaillé sur la <a href='./privacy.html'>page confidentialité</a> : ce qui est collecté, où c’est hébergé, et ce que la mesure d’usage envoie exactement."
          data-en="It is all on the <a href='./privacy.html'>privacy page</a>: what is collected, where it is hosted, and exactly what the usage analytics send."
        ></p>

        <h2 data-fr="Bêta" data-en="Beta"></h2>
        <p
          data-fr="Todo Bene est en bêta sur TestFlight, iPhone d’abord. Si quelque chose casse, écris — un bug signalé pendant la bêta est réparé pendant la bêta."
          data-en="Todo Bene is in beta on TestFlight, iPhone first. If something breaks, write in — a bug reported during the beta is a bug fixed during the beta."
        ></p>
      </main>
